name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # The packed SDK must load from both import and require, with types.
      - name: Smoke test the packed SDK
        run: |
          cd packages/sdk-ts && npm pack --pack-destination /tmp >/dev/null
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm i /tmp/agentidentity-sdk-*.tgz >/dev/null
          node -e 'const m = require("@agentidentity/sdk"); if (typeof m.AgentClient !== "function") process.exit(1)'
          node --input-type=module -e 'import { AgentClient } from "@agentidentity/sdk"; if (typeof AgentClient !== "function") process.exit(1)'
